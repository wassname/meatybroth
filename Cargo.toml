[package]
name = "meatybroth"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
minijinja = { version = "2", features = ["builtins", "json", "urlencode"] }
rusqlite = "=0.38.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
url = "2"

[profile.dev]
debug = 0
