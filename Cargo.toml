[package]
name = "meatybroth"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
minijinja = { version = "2", features = ["builtins", "json", "urlencode"] }
rusqlite = "=0.38.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
url = "2"
ammonia = "4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
linkify = "0.10"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
bech32 = "0.11"
html-escape = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[profile.dev]
debug = 0
