[package]
name = "meatybroth"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
aws-config = { version = "1.12.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-bedrockruntime = { version = "1.143.0", default-features = false, features = ["default-https-client", "rt-tokio", "rustls"] }
minijinja = { version = "2", features = ["builtins", "json", "urlencode"] }
rusqlite = "=0.38.0"
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
url = "2"
ammonia = "4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
linkify = "0.10"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
bech32 = "0.11"
html-escape = "0.2"
nostr-sdk = "=0.45.2"
nostr-sqlite = "=0.45.1"
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
fastembed = { version = "=6.0.2", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
sha2 = "=0.10.9"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
axum = { version = "0.8", features = ["ws"] }
tempfile = "3"

[profile.dev]
debug = 0
