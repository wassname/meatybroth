[project]
name = "meatybroth"
version = "0.1.0"
description = "A small personal Nostr and LessWrong reader"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1,<4",
  "markdown>=3.8,<4",
  "nh3>=0.2.22,<0.4",
  "requests>=2.32,<3",
  "websocket-client>=1.8,<2",
  "coincurve>=21,<22",
  "gunicorn>=23,<26",
  "loguru>=0.7,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "playwright>=1.50,<2",
    "pyyaml>=6,<7",
    "livereload>=2.7.1",
]

[tool.uv]
package = false
exclude-newer = "8 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
